name: Replit Pinger
on:
  schedule:
    - cron: '*/5 * * * *'  # هاي معناها "انغزه كل 5 دقائق"
  workflow_dispatch:      # عشان تقدر تشغله يدوي إذا حبيت

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests
      - name: Run pinger
        run: python pinger.py
